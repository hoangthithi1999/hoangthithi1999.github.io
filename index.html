<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heart Fireworks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #0d0d20;
    --bg-bottom: #05050c;
    --card: rgba(18, 18, 34, 0.9);
    --card-border: rgba(120, 130, 220, 0.35);
    --text: #f4f0fa;
    --muted: #b9b4c9;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background:
      radial-gradient(circle at 50% 35%, #1a1a35 0%, var(--bg-top) 40%, var(--bg-bottom) 100%);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    text-decoration: none;
    color: inherit;
  }
  .card {
    text-align: center;
    padding: 48px 44px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    box-shadow: 0 0 60px rgba(90, 100, 220, 0.18);
    max-width: 340px;
    width: calc(100% - 64px);
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .wrap:active .card {
    transform: scale(0.97);
  }
  .emoji {
    font-size: 52px;
    line-height: 1;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 14px;
  }
  .sub {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 0 0 10px;
  }
  .sub .heart {
    font-size: 22px;
    filter: drop-shadow(0 0 6px rgba(255, 60, 100, 0.7));
  }
  .sub .name {
    font-family: 'Great Vibes', cursive;
    font-size: 46px;
    line-height: 1;
    font-weight: 400;
    background: linear-gradient(180deg, #ffd9e6 0%, #ff6f9c 55%, #ff2d6b 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 18px rgba(255, 90, 130, 0.55);
  }
  .hint {
    font-size: 14px;
    color: var(--muted);
    margin: 14px 0 0;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <a class="wrap" href="fireworks.html">
    <div class="card">
      <div class="emoji">💝💝💝💝💝</div>
      <h1>Heart Fireworks</h1>
      <p class="sub"><span class="heart">💕</span><span class="name">Hoàng Thi</span><span class="heart">💕</span></p>
      <p class="hint">Chạm vào màn hình để bắt đầu</p>
    </div>
  </a>
</body>
</html>
