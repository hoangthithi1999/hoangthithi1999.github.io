<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>💕 ℋℴà𝓃ℊ 𝒯𝒽𝒾 💕</title>
<style>
  :root {
    --bg: #05050c;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    overflow: hidden;
    touch-action: manipulation;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: var(--bg);
  }
  #hint {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    color: rgba(150, 160, 190, 0.85);
    font-family: 'Georgia', 'Times New Roman', serif;
    font-style: italic;
    font-size: 14px;
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Chạm hoặc bấm vào bất kỳ đâu để gửi một trái tim</div>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const CYAN = '0,220,255';
  const BLUE = '30,144,255';
  const PINK = '255,120,203';
  const PURPLE = '180,100,255';
  const LIGHT = '180,230,255';
  const COLORS = [CYAN, BLUE, PINK, PURPLE, LIGHT];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const choice = (arr) => arr[(Math.random() * arr.length) | 0];

  // heart parametric curve (same formula as the Python original)
  function heartPoint(t, scale) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(
      13 * Math.cos(t) -
      5 * Math.cos(2 * t) -
      2 * Math.cos(3 * t) -
      Math.cos(4 * t)
    );
    return [x * scale, y * scale];
  }

  // ---------- floating background hearts ----------
  class FloatingHeart {
    constructor() {
      this.x = rnd(20, W - 20);
      this.y = H + rnd(0, 100);
      this.size = rnd(0.3, 0.8);
      this.speedY = rnd(0.8, 2.2);
      this.swingSpeed = rnd(0.02, 0.05);
      this.swingAmount = rnd(1.0, 2.5);
      this.swingAngle = rnd(0, Math.PI * 2);
      this.color = choice(COLORS);
      this.alpha = rnd(120, 220) / 255;
    }
    update() {
      this.y -= this.speedY;
      this.swingAngle += this.swingSpeed;
      this.x += Math.sin(this.swingAngle) * this.swingAmount;
      if (this.y < -30) {
        this.y = H + rnd(10, 50);
        this.x = rnd(20, W - 20);
      }
    }
    draw() {
      ctx.fillStyle = `rgba(${this.color},${this.alpha})`;
      for (let i = 0; i < 360; i += 15) {
        const t = (i * Math.PI) / 180;
        const [hx, hy] = heartPoint(t, this.size);
        ctx.beginPath();
        ctx.arc(this.x + hx, this.y + hy, 1, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---------- text that appears after explosion ----------
  class FloatingText {
    constructor(x, y, text) {
      this.x = x;
      this.y = y;
      this.text = text;
      this.alpha = 255;
      this.life = 180;
    }
    update() {
      this.life -= 1;
      this.alpha -= 1.2;
      this.y -= 0.08;
    }
    draw() {
      if (this.alpha > 0) {
        ctx.font = 'bold 26px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = `rgba(255,255,255,${Math.max(0, this.alpha) / 255})`;
        ctx.fillText(this.text, this.x, this.y);
      }
    }
  }

  // ---------- firework particles ----------
  class Particle {
    constructor(x, y, vx, vy, color) {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.color = color;
      this.alpha = rnd(200, 255);
      this.decay = rnd(1.0, 2.0);
      this.size = rnd(1.5, 3.5);
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.95;
      this.vy *= 0.95;
      this.vy += 0.02;
      this.alpha -= this.decay;
    }
    draw() {
      if (this.alpha > 0) {
        ctx.fillStyle = `rgba(${this.color},${Math.max(0, this.alpha) / 255})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(1, this.size), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---------- rising rocket ----------
  class HeartFirework {
    constructor(x, y, text) {
      this.x = x !== undefined ? x : rnd(200, W - 200);
      this.targetY = y !== undefined ? y : rnd(H * 0.25, H * 0.55);
      this.y = H;
      this.speed = rnd(9, 13);
      this.exploded = false;
      this.text = text;
    }
    update() {
      this.y -= this.speed;
      if (this.y <= this.targetY) this.exploded = true;
    }
  }

  // ---------- scrolling greeting text (right to left) ----------
  class MarqueeText {
    constructor() {
      this.text = 'Chúc em Trung thu vui vẻ, ấm áp và hạnh phúc bên gia đình !!!!';
      this.colors = [
        '255,80,120', '255,180,60', '255,240,80', '80,255,150',
        '70,220,255', '120,150,255', '210,100,255', '255,100,210'
      ];
      this.y = 18;
      this.speed = 3.0;
      this.font = 'bold 26px Georgia, "Times New Roman", serif';
      this.chars = Array.from(this.text);
      this.measure();
      this.x = W;
    }
    measure() {
      ctx.font = this.font;
      this.charWidths = this.chars.map((ch) => ctx.measureText(ch).width);
      this.totalWidth = this.charWidths.reduce((a, b) => a + b, 0);
    }
    update() {
      this.x -= this.speed;
      if (this.x < -this.totalWidth) this.x = W;
    }
    draw() {
      ctx.font = this.font;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      let x = this.x;
      for (let i = 0; i < this.chars.length; i++) {
        const color = this.colors[i % this.colors.length];
        ctx.fillStyle = `rgba(${color},0.22)`;
        ctx.fillText(this.chars[i], x + 1, this.y + 1);
        ctx.fillStyle = `rgb(${color})`;
        ctx.fillText(this.chars[i], x, this.y);
        x += this.charWidths[i];
      }
    }
  }
  const marqueeText = new MarqueeText();

  // ---------- system state ----------
  let fireworks = [];
  let particles = [];
  let floatingTexts = [];
  let floatingHearts = Array.from({ length: 25 }, () => new FloatingHeart());

  const textSequence = [' 💕 ℋℴà𝓃ℊ 𝒯𝒽𝒾 💕', 'Forever Yours', 'Thinking of You'];
  let textIndex = 0;

  function nextText() {
    const t = textSequence[textIndex];
    textIndex = (textIndex + 1) % textSequence.length;
    return t;
  }

  function launch(x, y, immediate) {
    const fw = new HeartFirework(x, y, nextText());
    if (immediate) fw.exploded = true;
    fireworks.push(fw);
  }

  function explode(fw) {
    for (let layer = 1; layer <= 3; layer++) {
      const scale = layer * 4.5;
      for (let i = 0; i < 360; i += 3) {
        const t = (i * Math.PI) / 180;
        const [hx, hy] = heartPoint(t, scale);
        const f = rnd(0.08, 0.14);
        particles.push(new Particle(fw.x, fw.y, hx * f, hy * f, choice(COLORS)));
      }
    }
    floatingTexts.push(new FloatingText(fw.x, fw.y, fw.text));
  }

  // auto-fire every 1.8s
  setInterval(() => launch(undefined, undefined, false), 1800);
  // first one shortly after load
  setTimeout(() => launch(undefined, undefined, false), 400);

  function firePoint(clientX, clientY) {
    launch(clientX, clientY, true);
  }
  canvas.addEventListener('pointerdown', (e) => {
    firePoint(e.clientX, e.clientY);
  });

  function frame() {
    ctx.clearRect(0, 0, W, H);

    marqueeText.update();
    marqueeText.draw();

    for (const fh of floatingHearts) {
      fh.update();
      fh.draw();
    }

    for (let i = fireworks.length - 1; i >= 0; i--) {
      const fw = fireworks[i];
      if (!fw.exploded) {
        fw.update();
        ctx.fillStyle = `rgb(${CYAN})`;
        ctx.beginPath();
        ctx.arc(fw.x, fw.y, 3, 0, Math.PI * 2);
        ctx.fill();
      } else {
        explode(fw);
        fireworks.splice(i, 1);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.update();
      p.draw();
      if (p.alpha <= 0) particles.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.update();
      ft.draw();
      if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
